version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: Development
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: Development
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
