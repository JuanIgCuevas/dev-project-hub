<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Organiza tus proyectos de desarrollo personales en un solo lugar." />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('devhub-theme') || 'system'
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch { /* El proveedor de tema aplicará el valor al iniciar. */ }
      })()
    </script>
    <title>Dev Project Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
